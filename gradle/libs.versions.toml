#
# Single source of truth for dependency versions.
#
# AGENTS.md rule: "Do not pin dependency numbers in source files outside libs.versions.toml".
# Nothing in any build.gradle.kts may hard-code a version string.
#
[versions]
# --- Android platform baseline (00_README_START_HERE.md) ---------------------
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

# --- Toolchain ---------------------------------------------------------------
agp = "9.3.1"
# Pinned to the Kotlin that AGP 9.3.1 supplies through its built-in Kotlin support. The
# Android modules compile with that version whatever this says, so a newer Kotlin here would
# produce core:music metadata the app module could not read. Raise it with AGP, not before.
kotlin = "2.2.10"
# The KSP release built against the Kotlin above. KSP is versioned <kotlin>-<ksp>, so this
# moves only when `kotlin` does — a mismatched pair fails to resolve rather than misbehaving.
ksp = "2.2.10-2.0.2"
javaToolchain = "21"

# --- AndroidX / Compose ------------------------------------------------------
composeBom = "2026.08.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
navigation3 = "1.1.6"
material3Adaptive = "1.3.0"

# --- Kotlin libraries --------------------------------------------------------
coroutines = "1.11.0"
kotlinxSerialization = "1.11.0"

# --- Persistence -------------------------------------------------------------
room = "2.8.4"
datastore = "1.2.1"

# --- Test --------------------------------------------------------------------
junit4 = "4.13.2"
junitJupiter = "6.1.3"
junitPlatform = "6.1.3"
turbine = "1.2.1"
# A pure-JVM SQLite, so the exported Room schema can be created and exercised in ordinary unit
# tests. Room's own MigrationTestHelper needs a device; the schema it exports does not.
sqliteJdbc = "3.53.2.1"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
# --- Compose (versions come from the BOM) ------------------------------------
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "material3Adaptive" }

# --- AndroidX ----------------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }

# --- Persistence -------------------------------------------------------------
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Kotlin ------------------------------------------------------------------
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- Test --------------------------------------------------------------------
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# Android modules need the JUnit 5 variant named explicitly: the built-in Kotlin support in
# AGP 9 does not infer the test framework the way the Kotlin JVM plugin does.
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
