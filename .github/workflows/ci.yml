name: CI

# 17_BUILD_CI_INSTALL_RELEASE.md §2: run on pull requests and on main; test, lint, assemble
# debug, upload the APK. Instrumented emulator jobs are added once this base pipeline is stable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write, not read: the sideload step below publishes the debug APK as a release asset so it
  # can be installed by tapping a link, instead of a login-gated artifact zip.
  contents: write

jobs:
  verify:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # Must match javaToolchain in gradle/libs.versions.toml.
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Music domain tests
        # Run first and on their own: 14_TESTING_AND_QUALITY.md §1 says the costliest failures
        # are musically incorrect judgments, so a theory regression should fail the build before
        # anything spends time on the Android toolchain.
        run: ./gradlew :core:music:test --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: harmony-gates-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish sideload APK as a release asset
        # A workflow artifact is a zip behind a GitHub login, and its timestamps are UTC with no
        # zone, so an extracted APK looks hours into the future. A release asset is the bare
        # .apk at a permanent URL that installs from a tap on the tablet.
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find app/build/outputs/harmony -name '*.apk' | head -1)"
          [ -n "$apk" ] || apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          tag="apk-${{ github.run_number }}-$(git rev-parse --short HEAD)"
          gh release create "$tag" "$apk" \
            --repo "${{ github.repository }}" \
            --title "Harmony Gates sideload $tag" \
            --notes "Debug-signed APK. Commit ${{ github.sha }}. Install with adb install -r, or open on the tablet." \
            --prerelease
          echo "RELEASE: $(gh release view "$tag" --repo "${{ github.repository }}" --json url -q .url)"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
