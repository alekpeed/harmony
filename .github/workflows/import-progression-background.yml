name: Finalize Progression Run background

on:
  push:
    branches:
      - fix/progression-background-runtime-decode-20260816

permissions:
  contents: write

jobs:
  finalize-background:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and finalize image source
        shell: bash
        run: |
          set -euo pipefail
          image='interface/assets/progression-run-background.jpg'
          test -f "$image"
          bytes=$(stat -c '%s' "$image")
          magic=$(xxd -p -l 2 "$image")
          tail_magic=$(tail -c 2 "$image" | xxd -p)
          echo "validated=$bytes bytes magic=$magic tail=$tail_magic"
          test "$bytes" -gt 100000
          test "$magic" = 'ffd8'
          test "$tail_magic" = 'ffd9'
          file "$image" | grep -q 'JPEG image data'

          sed -i 's#assets/progression-run-background.webp#assets/progression-run-background.jpg#' app/build.gradle.kts
          grep -q 'assets/progression-run-background.jpg' app/build.gradle.kts

          git checkout origin/main -- buildSrc/src/main/kotlin/SyncInterfaceArtwork.kt
          git rm -f interface/assets/progression-run-background.png interface/assets/progression-run-background.webp
          git rm -f .github/workflows/import-progression-background.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts buildSrc/src/main/kotlin/SyncInterfaceArtwork.kt interface/assets/progression-run-background.jpg
          git commit -m 'Use validated JPEG for Progression Run background'
          git push origin HEAD:${GITHUB_REF_NAME}
