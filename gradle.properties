org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official

# KSP 2.2.10-2.0.2 registers its generated sources through `kotlin.sourceSets`, which AGP 9's
# built-in Kotlin support rejects by default. The KSP release that uses `android.sourceSets`
# instead is built against a newer Kotlin than AGP 9.3.1 supplies, and raising Kotlin alone
# would produce core:music metadata the app module could not read (see libs.versions.toml).
# So the check is relaxed until the two line up again. AGP itself suggests this flag.
android.disallowKotlinSourceSets=false
